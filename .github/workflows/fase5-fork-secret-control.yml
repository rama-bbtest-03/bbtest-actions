name: fase5-fork-secret-control
on:
  workflow_dispatch:
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: echo secret (control positif)
        env:
          CANARY: ${{ secrets.FORK_CANARY }}
        run: |
          echo "control-canary-length=${#CANARY}"
          echo "control-canary-value=${CANARY}"
