name: fase5-fork-artifact
on:
  workflow_dispatch:
jobs:
  make-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: create artifact file
        run: |
          mkdir -p artout
          echo "ARTIFACT-FORK-TEST" > artout/data.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fork-artifact-test
          path: artout/
